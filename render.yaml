services:
  - type: web
    name: my-app
    runtime: node
    plan: free
    autoDeploy: true
    # devDependencies (vite, tailwind) are needed to build the frontend.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTO_MIGRATE
        value: "true"
      - key: CSP_MODE
        value: report-only
      - key: APP_NAME
        value: My App
      - key: APP_URL          # e.g. https://my-app.onrender.com
        sync: false
      - key: DATABASE_URL     # Neon connection string
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: my-app
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: GHS
      - key: VITE_PAYSTACK_PUBLIC_KEY   # build-time, public
        sync: false
      - key: VITE_APP_NAME              # build-time, public
        value: My App
