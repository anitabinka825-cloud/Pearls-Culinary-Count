databases:
  - name: pearls-db
    plan: free
    databaseName: pearls

services:
  - type: web
    name: pearls-culinary-counts
    runtime: node
    plan: free # always on. Render's free web plan sleeps when idle, so the first customer would wait for a cold start
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CSP_MODE
        value: report-only # change to enforce after the checklist in README Stage 10
      - key: DATABASE_URL
        fromDatabase: { name: pearls-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CHANNELS
        value: mobile_money,card
      - key: SAILUP_API_KEY
        sync: false
      - key: SAILUP_SENDER_ID
        sync: false
      - key: SAILUP_WEBHOOK_SECRET
        sync: false
      - key: SMS_OWNER_PHONE
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
